const NETS={"0x38":{chainId:"0x38",chainName:"BNB Smart Chain",nativeCurrency:{name:"BNB",symbol:"BNB",decimals:18},rpcUrls:["https://bsc-dataseed.binance.org/"],blockExplorerUrls:["https://bscscan.com"]},
"0x61":{chainId:"0x61",chainName:"BSC Testnet",nativeCurrency:{name:"tBNB",symbol:"tBNB",decimals:18},rpcUrls:["https://data-seed-prebsc-1-s1.binance.org:8545/"],blockExplorerUrls:["https://testnet.bscscan.com"]}};
const log=m=>{document.getElementById('log').textContent+="\n"+m};
const pad=h=>h.padStart(64,'0');
const u256=n=>pad(BigInt(n).toString(16));
function encStr(s){const b=new TextEncoder().encode(s);let h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');const len=u256(b.length);while(h.length%64)h+='0';return len+h;}
function encode(fs,ps,uri,addr){return u256(fs)+u256(ps)+u256(128)+pad(addr.toLowerCase().replace('0x',''))+encStr(uri);}
document.getElementById('go').onclick=async()=>{
 const btn=document.getElementById('go');
 try{
  if(!window.ethereum){log("No wallet found. Open this page in MetaMask's browser or a desktop browser with MetaMask.");return;}
  btn.disabled=true;
  const [acct]=await ethereum.request({method:'eth_requestAccounts'});log("Wallet: "+acct);
  const net=document.getElementById('net').value;
  try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:net}]});}
  catch(e){if(e.code===4902)await ethereum.request({method:'wallet_addEthereumChain',params:[NETS[net]]});else throw e;}
  const fs=document.getElementById('fs').value,ps=document.getElementById('ps').value,uri=document.getElementById('uri').value.trim();
  let roy=document.getElementById('roy').value.trim()||acct;
  if(!/^0x[0-9a-fA-F]{40}$/.test(roy))throw new Error("Royalty address is invalid");
  const data=BYTECODE+encode(fs,ps,uri,roy);
  log("Confirm the deploy in your wallet...");
  const tx=await ethereum.request({method:'eth_sendTransaction',params:[{from:acct,data}]});
  const ex=NETS[net].blockExplorerUrls[0];log("Sent: "+tx+"\nWaiting for confirmation...");
  let r=null;while(!r){await new Promise(s=>setTimeout(s,3000));r=await ethereum.request({method:'eth_getTransactionReceipt',params:[tx]});}
  if(r.status!=="0x1")throw new Error("Deploy failed on-chain");
  log("\nDEPLOYED \u2714\nContract: "+r.contractAddress);
  const a=document.createElement('a');a.href=ex+"/address/"+r.contractAddress;a.target="_blank";a.textContent="View on BscScan";document.getElementById('log').appendChild(document.createElement('br'));document.getElementById('log').appendChild(a);
  log("\nNext: call setMintOpen(true) when ready, and send the address to Hark.");
 }catch(e){log("Error: "+(e.message||e));btn.disabled=false;}
};
